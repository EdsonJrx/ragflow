<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Registry</title>
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#64717d; --line:#d9dee3; --bg:#f5f7f8; --panel:#fff; --accent:#176b5b; --danger:#a23b3b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; letter-spacing:0; }
    header { height:64px; background:#17212b; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
    h1 { margin:0; font-size:20px; font-weight:650; } h2 { font-size:17px; margin:0 0 16px; } h3 { font-size:15px; margin:0; }
    main { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:calc(100vh - 64px); }
    aside { border-right:1px solid var(--line); background:#eef1f2; padding:20px; }
    section { padding:28px; max-width:1100px; width:100%; }
    button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:5px; min-height:36px; padding:7px 12px; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.danger { color:var(--danger); }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; }
    .app { width:100%; text-align:left; margin-bottom:8px; padding:10px; } .app.active { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); }
    .app small,.muted { color:var(--muted); display:block; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
    th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    dialog { border:1px solid var(--line); border-radius:6px; padding:0; width:min(560px,calc(100vw - 32px)); box-shadow:0 18px 60px #0003; }
    dialog::backdrop { background:#17212b88; } form { padding:22px; } form h2 { margin-bottom:18px; }
    label { display:block; margin:12px 0 5px; color:var(--muted); font-weight:600; }
    input,select { width:100%; border:1px solid #b8c0c7; border-radius:4px; min-height:38px; padding:8px 10px; font:inherit; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
    .key { background:#eef6f4; border:1px solid #a9cfc6; padding:12px; overflow-wrap:anywhere; margin-top:14px; }
    #notice { position:fixed; right:20px; bottom:20px; background:#17212b; color:#fff; padding:11px 14px; border-radius:5px; display:none; }
    @media(max-width:760px){ main{grid-template-columns:1fr} aside{border-right:0;border-bottom:1px solid var(--line)} section{padding:18px} td:nth-child(3),th:nth-child(3){display:none} }
  </style>
</head>
<body>
  <header><h1>Token Registry</h1><span id="admin"></span></header>
  <main>
    <aside>
      <div class="toolbar"><strong>Aplicações</strong><button id="newApp" title="Nova aplicação">+</button></div>
      <div id="apps"></div>
    </aside>
    <section>
      <div class="toolbar"><div><h2 id="title">Selecione uma aplicação</h2><span class="muted" id="subtitle"></span></div><button class="primary" id="newUser" hidden>Novo usuário</button></div>
      <table id="users" hidden><thead><tr><th>Usuário</th><th>Identificador Cloudflare</th><th>Tipo</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    </section>
  </main>
  <dialog id="appDialog"><form method="dialog"><h2>Nova aplicação</h2><label>Nome</label><input name="name" required><label>Identificador</label><input name="slug" pattern="[a-z0-9][a-z0-9-]{1,62}" required><label>Cloudflare Team Domain</label><input name="cf_team_domain" placeholder="empresa.cloudflareaccess.com" required><label>Cloudflare Audience</label><input name="cf_audience" required><div id="resolverKey"></div><div class="actions"><button value="cancel">Cancelar</button><button class="primary" value="save">Criar</button></div></form></dialog>
  <dialog id="userDialog"><form method="dialog"><h2>Cadastrar usuário</h2><label>Tipo de identidade</label><select name="principal_type"><option value="service_token">Service token</option><option value="email">E-mail</option></select><label>Client ID ou e-mail</label><input name="principal_value" required><label>Identidade interna</label><input name="identity" type="email" required><label>Nome</label><input name="display_name" required><label>API key da aplicação</label><input name="credential" type="password" autocomplete="new-password" required><div class="actions"><button value="cancel">Cancelar</button><button class="primary" value="save">Salvar</button></div></form></dialog>
  <div id="notice"></div>
  <script>
    let csrf="",selected=null,applications=[];
    const q=s=>document.querySelector(s), esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])), api=async(url,options={})=>{options.headers={...(options.headers||{}),"Content-Type":"application/json","X-CSRF-Token":csrf};const r=await fetch(url,options);const b=await r.json();if(!r.ok)throw Error(b.error||"Falha");return b};
    const notify=m=>{q("#notice").textContent=m;q("#notice").style.display="block";setTimeout(()=>q("#notice").style.display="none",3000)};
    async function loadApps(){applications=await api("/api/admin/applications");q("#apps").innerHTML=applications.map(a=>`<button class="app ${selected===a.slug?"active":""}" data-slug="${esc(a.slug)}"><strong>${esc(a.name)}</strong><small>${Number(a.principal_count)} usuário(s)</small></button>`).join("");document.querySelectorAll(".app").forEach(b=>b.onclick=()=>selectApp(b.dataset.slug));}
    async function selectApp(slug){selected=slug;const a=applications.find(x=>x.slug===slug);q("#title").textContent=a.name;q("#subtitle").textContent=a.slug;q("#newUser").hidden=false;q("#users").hidden=false;await loadUsers();await loadApps();}
    async function loadUsers(){const rows=await api(`/api/admin/applications/${encodeURIComponent(selected)}/principals`);q("#users tbody").innerHTML=rows.map(u=>`<tr><td><strong>${esc(u.display_name)}</strong><span class="muted">${esc(u.identity)}</span></td><td>${esc(u.principal_value)}</td><td>${u.principal_type==="service_token"?"Service token":"E-mail"}</td><td>${u.enabled?"Ativo":"Inativo"}</td><td><button data-id="${Number(u.id)}" data-enabled="${u.enabled?0:1}">${u.enabled?"Desativar":"Ativar"}</button></td></tr>`).join("");document.querySelectorAll("#users tbody button").forEach(b=>b.onclick=async()=>{await api(`/api/admin/principals/${b.dataset.id}`,{method:"PATCH",body:JSON.stringify({enabled:b.dataset.enabled==="1"})});await loadUsers()});}
    q("#newApp").onclick=()=>{q("#appDialog form").reset();q("#resolverKey").innerHTML="";q("#appDialog").showModal()};
    q("#newUser").onclick=()=>{q("#userDialog form").reset();q("#userDialog").showModal()};
    q("#appDialog").addEventListener("close",async()=>{if(q("#appDialog").returnValue!=="save")return;const f=Object.fromEntries(new FormData(q("#appDialog form")));try{const r=await api("/api/admin/applications",{method:"POST",body:JSON.stringify(f)});q("#resolverKey").innerHTML=`<div class="key"><strong>Salve agora. Esta chave não será exibida novamente:</strong><br>${esc(r.resolver_key)}</div>`;q("#appDialog").showModal();await loadApps()}catch(e){notify(e.message)}});
    q("#userDialog").addEventListener("close",async()=>{if(q("#userDialog").returnValue!=="save")return;const f=Object.fromEntries(new FormData(q("#userDialog form")));try{await api(`/api/admin/applications/${encodeURIComponent(selected)}/principals`,{method:"POST",body:JSON.stringify(f)});notify("Usuário salvo");await loadUsers();await loadApps()}catch(e){notify(e.message)}});
    (async()=>{const s=await api("/api/admin/session");csrf=s.csrf_token;q("#admin").textContent=s.email;await loadApps()})().catch(e=>notify(e.message));
  </script>
</body>
</html>
